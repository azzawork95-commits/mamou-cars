<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>MAMOU CARS | Azrou</title>
<style>
:root{--gold:#d5b36b;--black:#101010;--panel:#1b1b1b;--muted:#b8b2a6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#34302a 0,#101010 52%);color:#fff;font-family:Arial,Helvetica,sans-serif}
main{width:min(100%,430px);text-align:center;padding:34px 24px 28px;border:1px solid rgba(213,179,107,.55);border-radius:24px;background:rgba(20,20,20,.94);box-shadow:0 24px 70px #0008}
.mark{width:76px;height:76px;margin:0 auto 18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:30px}
h1{font-size:clamp(30px,8vw,42px);letter-spacing:4px;margin:0;color:var(--gold)}
.subtitle{margin:10px 0 5px;letter-spacing:2px;font-size:12px;font-weight:bold}
.location{color:var(--muted);font-size:14px;margin:0 0 28px}
h2{font-size:17px;font-weight:500;margin:0 0 16px}
a{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fff;font-weight:bold;padding:17px 18px;border-radius:13px;margin:12px 0;font-size:16px;transition:transform .18s,filter .18s}
a:hover{transform:translateY(-2px);filter:brightness(1.12)}
.tiktok{background:#252525;border:1px solid #555}
.facebook{background:#1877f2}
.icon{font-size:21px}
.phone{margin:25px 0 0;color:var(--gold);font-size:15px;letter-spacing:1px}
footer{color:#8d877b;font-size:11px;margin-top:18px;letter-spacing:1px}
</style>
</head>
<body>
<main>
  <div class="mark">MC</div>
  <h1>MAMOU CARS</h1>
  <p class="subtitle">LOCATION DE VOITURE</p>
  <p class="location">AZROU · MAROC 🇲🇦</p>
  <h2>Retrouvez-nous sur</h2>
  <a class="tiktok" href="https://www.tiktok.com/@mamou.cars" target="_blank" rel="noopener noreferrer"><span class="icon">♪</span> TikTok</a>
  <a class="facebook" href="https://www.facebook.com/p/Location-de-voiture-AZROU-MAMOU-CARS-100063489822827/?locale=ar_AR" target="_blank" rel="noopener noreferrer"><span class="icon">f</span> Facebook</a>
  <p class="phone">+212 699 982 263</p>
  <footer>SCAN · CHOOSE · CONNECT</footer>
</main>
</body>
</html>
